name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bttsbet-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (fresh data on every push)
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs


      - name: Update win history
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs


      - name: Build Next.js static export
        run: npm run build

      - name: Verify SEO output
        run: node scripts/verify-seo.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html
          cp out/index.html out/200.html
          cp public/_redirects out/_redirects
          cp public/.htaccess out/.htaccess
          cp public/robots.txt out/robots.txt
          cp public/sitemap.xml out/sitemap.xml

      - name: Commit and push updated data
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "bot@bttsbet.online"
          git config --local user.name "BttsBet Bot"
          git add public/predictions.json public/win-history.json public/predictions-archive/
          git diff --staged --quiet || git commit -m "chore: auto-update data [skip ci]"
          git push || echo "No changes to push"

      - name: Deploy to server via FTP
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/node_modules/**
