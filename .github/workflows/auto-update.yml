name: Daily Auto Update & Deploy

on:
  schedule:
    # 06:00 UTC (06:00 Dakar), 14:00 UTC (14:00 Dakar), 22:00 UTC (22:00 Dakar)
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

concurrency:
  group: bttsbet-production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN)
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs


      - name: Update win history
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs


      - name: Debug — show data freshness
        run: |
          echo "=== predictions.json ==="
          node -e "const d=require('./public/predictions.json');console.log('Date:',d.date,'Predictions:',d.predictions.length)"
          echo "=== win-history.json ==="
          node -e "const d=require('./public/win-history.json');console.log('Date:',d.date,'History:',d.history?.length||0,'Rate:',d.stats?.rate)"

      - name: Build Next.js static export
        run: npm run build

      - name: Verify SEO output
        run: node scripts/verify-seo.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html
          cp out/index.html out/200.html
          cp public/_redirects out/_redirects
          cp public/.htaccess out/.htaccess
          cp public/robots.txt out/robots.txt
          cp public/sitemap.xml out/sitemap.xml

      - name: Commit and push updated data
        run: |
          git config --local user.email "bot@bttsbet.online"
          git config --local user.name "BttsBet Bot"
          git add public/predictions.json public/win-history.json public/predictions-archive/
          git diff --staged --quiet || git commit -m "chore: auto-update data [skip ci]"
          git push || echo "No changes to push"

      - name: Deploy to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/node_modules/**
