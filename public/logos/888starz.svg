<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56" role="img" aria-label="888starz">
  <defs>
    <linearGradient id="star-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#D63148"/>
    </linearGradient>
    <linearGradient id="star-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE5EB"/>
    </linearGradient>
    <radialGradient id="star-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background pill -->
  <rect x="0" y="0" width="200" height="56" rx="14" fill="url(#star-bg)"/>
  <rect x="0" y="0" width="200" height="28" rx="14" fill="#FFFFFF" opacity="0.08"/>
  <!-- Star icon -->
  <g transform="translate(28,28)">
    <circle r="14" fill="url(#star-glow)"/>
    <polygon points="0,-12 3.5,-3.7 12,-3.7 5.3,2 7.4,10 0,5.5 -7.4,10 -5.3,2 -12,-3.7 -3.5,-3.7" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <text x="50" y="36" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
    <tspan fill="url(#star-text)">888</tspan><tspan fill="#FFD700">starz</tspan>
  </text>
</svg>
